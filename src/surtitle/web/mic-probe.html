<!DOCTYPE html><meta charset=utf-8><title>Audio device probe</title>
<style>body{font:14px -apple-system,sans-serif;padding:24px;max-width:760px}li{margin:6px 0;font-family:ui-monospace,monospace;font-size:13px}.bad{color:#c00}.good{color:#080}</style>
<h2>Surtitle microphone probe</h2>
<p>Click the button and grant the microphone. Then copy everything below.</p>
<button id=go style="padding:10px 18px;font-size:15px">Probe microphone</button>
<pre id=out style="background:#f5f5f5;padding:14px;border-radius:8px;white-space:pre-wrap"></pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += s + "\n"; };

document.getElementById('go').onclick = async () => {
  out.textContent = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    const track = stream.getAudioTracks()[0];
    const settings = track.getSettings ? track.getSettings() : {};
    log("=== GRANTED ===");
    log("label        : " + (track.label || "(empty - permission not granted)"));
    log("enabled      : " + track.enabled);
    log("muted        : " + track.muted);
    log("readyState   : " + track.readyState);
    log("settings     : " + JSON.stringify(settings));

    const devices = await navigator.mediaDevices.enumerateDevices();
    log("\n=== ALL INPUT DEVICES ===");
    devices.filter(d => d.kind === 'audioinput').forEach((d, i) => {
      const active = d.deviceId === settings.deviceId ? "  <-- IN USE" : "";
      log(`[${i}] ${d.label || "(label hidden)"} id=${d.deviceId.slice(0,12)}...${active}`);
    });

    // Measure actual signal for 3 seconds.
    const ctx = new AudioContext();
    log("\n=== CAPTURE CONTEXT ===");
    log("state before resume : " + ctx.state);
    if (ctx.state === 'suspended') await ctx.resume();
    log("state after resume  : " + ctx.state);
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let peak = 0;
    log("\n=== MEASURING 3 s (speak now) ===");
    const t0 = performance.now();
    const timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v));
      peak = Math.max(peak, m);
    }, 50);
    await new Promise(r => setTimeout(r, 3000));
    clearInterval(timer);
    log("peak amplitude over 3 s : " + peak.toFixed(5) + (peak < 0.0005 ? "  <-- SILENT (no signal reaching browser)" : "  <-- SIGNAL PRESENT"));
    // ---- Does an AudioWorklet run at all in this browser? ----------------
    // The application's capture path uses an AudioWorklet. If the worklet never
    // executes here, that is the whole bug. An oscillator is used so the test
    // does not depend on the microphone.
    log("\n=== AUDIOWORKLET TEST (oscillator, no mic) ===");
    try {
      const wctx = new AudioContext();
      log("worklet ctx state : " + wctx.state);
      // Resume and then VERIFY: a resolved resume() does not guarantee the
      // context is running, and addModule() succeeds even while suspended --
      // which is how a worklet ends up attached but never driven.
      for (let i = 0; i < 12 && wctx.state !== 'running'; i++) {
        await wctx.resume().catch(() => {});
        if (wctx.state !== 'running') await new Promise(r => setTimeout(r, 60));
      }
      log("worklet ctx after : " + wctx.state);
      await wctx.audioWorklet.addModule('/static/js/capture-worklet.js');
      log("worklet module    : loaded");
      const osc = wctx.createOscillator();
      const g = wctx.createGain();
      g.gain.value = 0.3;
      const node = new AudioWorkletNode(wctx, 'capture-processor', {
        numberOfInputs: 1, numberOfOutputs: 0
      });
      let frames = 0, lv = 0, peakW = 0;
      node.port.onmessage = (ev) => {
        if (ev.data.type === 'audio') frames++;
        else if (ev.data.type === 'level') { lv++; peakW = Math.max(peakW, ev.data.value); }
      };
      osc.connect(g); g.connect(node); osc.start();
      node.port.postMessage({ type: 'mute', value: false });
      await new Promise(r => setTimeout(r, 2000));
      log("worklet frames    : " + frames);
      log("worklet level msgs: " + lv + " peak=" + peakW.toFixed(3));
      log(frames > 10
        ? "WORKLET: PASS (the worklet executes in this browser)"
        : "WORKLET: FAIL (the worklet never produced a frame -- this is the bug)");
    } catch (e) {
      log("WORKLET: ERROR " + e.name + ": " + e.message);
    }

    stream.getTracks().forEach(t => t.stop());
    ctx.close();
  } catch (e) {
    log("ERROR: " + e.name + ": " + e.message);
  }
};
</script>
