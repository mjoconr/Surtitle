[project]
name = "surtitle"
version = "0.10.0"
description = "Voice-first agentic workbench — talk to an agent that reads your documents, writes and runs code, and answers out loud. Hear the conclusion, not the log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "voice",
    "agent",
    "agentic",
    "voice-assistant",
    "mcp",
    "deepseek",
    "deepgram",
    "llm",
    "stt",
    "tts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Required by FastAPI to parse multipart form/file uploads (attachments).
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=4.3",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Convenience extras a user may want the agent to be able to import inside
# `run_python`. Kept out of the default install to keep the release archive small.
extras = [
    "pandas>=2.2",
    "python-docx>=1.1",
    "Markdown>=3.6",
]
# Local speech engines: recognition and synthesis that never leave the machine.
# Kept out of the default install because it is ~13 MB of native runtime that a
# hosted voice user does not need, and because the wheels must exist for the
# platform. `sherpa-onnx` ships its own ONNX runtime, so there is no separate
# onnxruntime dependency to keep in step.
#
# The models themselves are NOT here: they are downloaded on demand by
# `surtitle models download` into the app data directory. See
# docs/VOICE.md.
voice-local = [
    "sherpa-onnx>=1.13,<2",
    # Declared explicitly even though `sherpa-onnx` depends on it: that wheel
    # marks `requires-dist` as dynamic in its metadata, so uv's resolver cannot
    # see the edge and would install the bindings without the native runtime
    # they link against. The symptom is an import that fails looking for
    # libonnxruntime/onnxruntime. The two are one ABI, so keep them at the same
    # version — a CI step asserts the installed pair matches.
    "sherpa-onnx-core>=1.13,<2",
]

[project.scripts]
surtitle = "surtitle.cli:main"

[project.urls]
Homepage = "https://github.com/mjoconr/Surtitle"
Repository = "https://github.com/mjoconr/Surtitle"
Issues = "https://github.com/mjoconr/Surtitle/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "surtitle"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put the repo root on sys.path so tests can share helpers via `tests.*` imports.
pythonpath = ["."]
markers = [
    "live: requires real DEEPSEEK_API_KEY / DEEPGRAM_API_KEY and network access",
]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "C4", "RUF"]
ignore = ["B008"] # Typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Tools deliberately convert broad failures into results the model can read,
# so blanket excepts are the design rather than an oversight.
"src/surtitle/tools/*" = ["BLE001"]
# The voice clients treat any socket failure as retryable.
"src/surtitle/voice/*" = ["BLE001"]
"src/surtitle/llm/*" = ["BLE001"]
# A failed turn is reported to the user, not raised into the session.
"src/surtitle/core/agent.py" = ["BLE001"]
"src/surtitle/core/session.py" = ["BLE001"]
"src/surtitle/server.py" = ["BLE001"]
# The tray's message pump runs on a thread whose stack Windows owns: an
# exception escaping the window procedure would take the process down instead of
# surfacing anywhere, so every failure is caught and recorded.
"src/surtitle/win32_tray.py" = ["BLE001"]
# A background job turns its failure into the state the tray and the UI read,
# because the request that started it has already been answered and has nobody
# left to raise into.
"src/surtitle/jobs.py" = ["BLE001"]
# Downloading a release treats any network or payload failure as "could not
# update", which is reported to the user rather than raised at them.
"src/surtitle/selfupdate.py" = ["BLE001"]
