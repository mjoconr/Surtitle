[project]
name = "surtitle"
version = "0.1.0"
description = "Voice-first agentic workbench: talk to an agent that reads your documents, writes code, and produces PDFs and spreadsheets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["voice", "agent", "deepseek", "deepgram", "llm", "stt", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=4.3",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Convenience extras a user may want the agent to be able to import inside
# `run_python`. Kept out of the default install to keep the release archive small.
extras = [
    "pandas>=2.2",
    "python-docx>=1.1",
    "Markdown>=3.6",
]

[project.scripts]
surtitle = "surtitle.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/Surtitle"
Repository = "https://github.com/OWNER/Surtitle"
Issues = "https://github.com/OWNER/Surtitle/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "surtitle"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real DEEPSEEK_API_KEY / DEEPGRAM_API_KEY and network access",
]
addopts = "-m 'not live' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "C4", "RUF"]
ignore = ["B008"] # Typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Tools deliberately convert broad failures into results the model can read,
# so blanket excepts are the design rather than an oversight.
"src/surtitle/tools/*" = ["BLE001"]
# The voice clients treat any socket failure as retryable.
"src/surtitle/voice/*" = ["BLE001"]
"src/surtitle/llm/*" = ["BLE001"]
# A failed turn is reported to the user, not raised into the session.
"src/surtitle/core/agent.py" = ["BLE001"]
"src/surtitle/core/session.py" = ["BLE001"]
"src/surtitle/server.py" = ["BLE001"]
