name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft release
        type: boolean
        default: true

permissions:
  contents: write

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  SURTITLE_HOME: ${{ github.workspace }}/.ci-home

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and format
        run: |
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen ruff check src tests scripts
      - name: Full test suite
        run: uv run --frozen pytest -q
      - name: Tag must match the packaged version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag.startswith("v") and tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"version {version} matches tag {tag or '(no tag)'}")
          PY

  build:
    name: Build ${{ matrix.artifact }}
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Must run on the target OS: compiled wheels are platform-specific, so a
      # cross-built archive would ship the wrong binaries.
      - name: Build the self-contained archive
        run: uv run --frozen python scripts/build_release.py
      - name: Smoke test the archive the way a user would
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tarfile, tempfile, zipfile

          archives = sorted(pathlib.Path("dist").glob("*.zip")) + sorted(
              pathlib.Path("dist").glob("*.tar.gz")
          )
          assert archives, "no archive found"
          archive = archives[0]

          target = pathlib.Path(tempfile.mkdtemp()) / "extracted"
          target.mkdir(parents=True)
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(target)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(target)

          # Unwrap the single top-level directory when the archive has one.
          roots = [p for p in target.iterdir() if p.is_dir()]
          root = roots[0] if len(roots) == 1 and not (target / "run.sh").exists() else target
          print("archive root:", root)

          # The bundled environment must import the app without touching the
          # network or any system Python.
          import subprocess, sys
          if sys.platform == "win32":
              python = root / "venv" / "Scripts" / "python.exe"
          else:
              python = root / "venv" / "bin" / "python"
          assert python.exists(), f"bundled interpreter missing at {python}"

          probe = subprocess.run(
              [str(python), "-c", "import surtitle, surtitle.server; print(surtitle.__version__)"],
              capture_output=True, text=True,
          )
          print(probe.stdout.strip() or probe.stderr.strip())
          assert probe.returncode == 0, "bundled runtime could not import the app"
          print("bundled runtime is functional")
          PY
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: surtitle-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          for file in *; do
            [ -f "$file" ] || continue
            shasum -a 256 "$file" >> SHA256SUMS.txt || sha256sum "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            artifacts/*
          body: |
            ## Surtitle ${{ github.ref_name }}

            Voice-first agentic workbench. Talk to an agent that reads the documents
            in a project, writes and runs code, and produces PDFs and spreadsheets.

            ### Windows

            Download the `windows-x64` archive, extract it anywhere, and run
            **`run.bat`**. No installer, no administrator rights, and no system
            Python required — the runtime is bundled.

            ### macOS / Linux

            Download the archive matching your platform, extract it, and run
            **`./run.sh`**.

            ### First run

            1. The app opens in your browser at `http://127.0.0.1:8765`.
            2. Open **Settings → API keys** and add your DeepSeek and Deepgram keys.
               Keys are stored locally with owner-only permissions.
            3. Create a project and start talking.

            Verify a download with the attached `SHA256SUMS.txt`.
