name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything, publish nothing
        type: boolean
        default: false
      draft:
        description: Publish as a draft release
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  SURTITLE_HOME: ${{ github.workspace }}/.ci-home

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and format
        run: |
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen ruff check src tests scripts
      - name: Full test suite
        run: uv run --frozen pytest -q
      - name: Tag must match the packaged version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag.startswith("v") and tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"version {version} matches tag {tag or '(no tag)'}")
          PY

  build:
    name: Build ${{ matrix.artifact }}
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            # Windows keeps the bundled runtime: SmartScreen offers "More info →
            # Run anyway", so one unsigned download is a prompt rather than a wall.
            build_args: ""
          # Apple silicon. `macos-latest` is arm64 now, so it is not the Intel
          # image it used to be.
          - os: macos-latest
            artifact: macos-arm64
            build_args: "--thin"
          # Intel. The image is different — `macos-13` was retired by GitHub and
          # this is what replaced it — but since macOS archives became thin the two
          # carry the same content: the sources and a launcher, with Python and the
          # wheels fetched by uv on first run. Both are still built and published
          # because `surtitle.selfupdate` chooses an asset by the architecture in
          # its name, so a Mac with no matching asset is a Mac that cannot update.
          #
          # Why thin: a macOS download carries `com.apple.quarantine`, and Gatekeeper
          # refuses every unsigned executable in it — the bundled interpreter, each
          # extension module, one dialog apiece, each saying macOS could not check it
          # for malware. A thin archive has no Mach-O in it at all (see
          # `docs/MACOS.md`), so there is nothing to refuse, and what uv downloads
          # afterwards never gets the flag because a program fetched it rather than
          # a browser.
          - os: macos-15-intel
            artifact: macos-intel
            build_args: "--thin"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # On the platform, before the build, which is the point. The `verify` job
      # above runs the suite once, on ubuntu, and that is not enough: a break that
      # only shows on Windows or Intel macOS passes it and publishes. That is not
      # hypothetical — 0.11.0 was tagged on a green ubuntu verify with a bug that
      # left every Windows install with no update, and this step is why the next
      # one cannot. It costs no extra runner: this one is here to build anyway.
      - name: Run the test suite for the platform this archive ships to
        run: uv run --frozen pytest -q
      # Must run on the target OS: compiled wheels are platform-specific, so a
      # cross-built archive would ship the wrong binaries. A thin archive has none,
      # and its verifier fetches and runs it here the way a first run does.
      - name: Build the self-contained archive
        run: uv run --frozen python scripts/build_release.py ${{ matrix.build_args }}
      - name: Re-verify the finished archives
        # scripts/build_release.py already extracted and smoke-tested the archive
        # it just built. This re-runs the *same* verifier over dist/, so the release
        # gate is the check a user could apply and the two deliberate layouts
        # live in exactly one place: a second copy of these rules is what asserted
        # a venv/ that a Windows archive never ships, failing every Windows build.
        run: uv run --frozen python scripts/build_release.py --verify-only
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: surtitle-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build]
    # The job always runs, including on a dry run, so that the checks below are
    # exercised before a real tag depends on them — a check that only runs when
    # publishing is a check nobody has run until it matters. Only the step that
    # creates the release is conditional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Before anything is hashed or published: a green run with a platform
      # missing is exactly how a release ships with nothing for one machine to
      # install, and it looks complete from the outside.
      - name: Every supported architecture must be here
        run: uv run --frozen python scripts/build_release.py --check-archives --archives-dir artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          for file in *; do
            [ -f "$file" ] || continue
            shasum -a 256 "$file" >> SHA256SUMS.txt || sha256sum "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      # The point of the dry run: everything above has now run against the real
      # artifacts, and this step is the only one that creates anything.
      - name: Create the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          # A pre-release is a version to try rather than one to be handed. Two
          # things follow from marking it: GitHub's "latest release" keeps pointing
          # at the last real one, and the updater refuses to offer a prerelease to
          # somebody running a released build. Set for a tag like v1.2.0-rc1 by
          # dispatching the workflow, which is why the input exists.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*
          body: |
            ## Surtitle ${{ github.ref_name }}

            Voice-first agentic workbench. Talk to an agent that reads the documents
            in a project, writes and runs code, and produces PDFs and spreadsheets.

            ### Windows

            Download the `windows-x64` archive, extract it anywhere, and run
            **`run.bat`**. No installer, no administrator rights, and no system
            Python required — the runtime is bundled.

            ### macOS

            Download the archive for your Mac — `arm64` for Apple silicon,
            `x86_64` for Intel — extract it, and run **`./run.sh`**. Nothing needs
            to be installed first: the first run fetches Python and the
            dependencies (a few minutes, once), and after that it starts straight
            away. Double-click **`Setup.command`** instead if you would like an
            entry in `~/Applications` and to be asked about starting at sign-in.

            This archive deliberately carries **no compiled binaries**: macOS
            refuses to run the unsigned ones in a browser download, one dialog per
            file, each mentioning malware. There is nothing here to refuse — it is
            sources and a shell script — so it starts normally however you
            downloaded it. See `docs/MACOS.md` in the archive or in the repository.

            ### Linux

            Download the archive matching your platform, extract it, and run
            **`./run.sh`**.

            ### Updating an Intel Mac, once, by hand

            This release adds the Intel build, so the updater it is meant to reach
            cannot deliver it: 0.10.0 did not know about architectures and would
            fetch the Apple silicon archive, which cannot start on an Intel Mac.
            Download `surtitle-${{ github.ref_name }}-darwin-x86_64.tar.gz`,
            extract it **over** your installation, and you are on the new updater —
            later releases install normally. Your settings, conversations and
            models live in the app data directory, not in the installation, so
            nothing is lost.

            ### First run

            1. The app opens in your browser at `http://127.0.0.1:8765`.
            2. Open **Settings → API keys** and add your DeepSeek and Deepgram keys.
               Keys are stored locally with owner-only permissions.
            3. Create a project and start talking.

            Verify a download with the attached `SHA256SUMS.txt`.
