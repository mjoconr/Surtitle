name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv's cache inside the workspace so the job works in restricted runners.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # The test suite is offline by design; nothing here needs a real API key.
  SURTITLE_HOME: ${{ github.workspace }}/.ci-home

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check formatting
        run: uv run --frozen ruff format --check src tests scripts
      - name: Lint
        run: uv run --frozen ruff check src tests scripts

  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run the test suite
        run: uv run --frozen --python ${{ matrix.python }} pytest -q --durations=10
      - name: Doctor must run without credentials
        # Exercises the real command path: it should exit non-zero when keys are
        # absent, but must not crash or hang.
        shell: bash
        run: |
          set +e
          uv run --frozen surtitle doctor --offline
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "doctor unexpectedly passed with no credentials configured"
            exit 1
          fi
          echo "doctor exited $code as expected (missing credentials)"

  local-voice:
    # The local speech engines are an optional extra, and an optional extra that
    # does not install on a supported platform is a feature nobody can use. This
    # job is deliberately cheap: install the extra and import it, on every platform
    # the project ships to and on both ends of the supported Python range. It never
    # downloads a model, so it costs a minute rather than a gigabyte.
    name: Local voice wheels (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: The app must still work without the extra
        # The default install is the one most people get, and it must not have
        # acquired a hard dependency on the local engines. Checked first, so a
        # leftover `.venv` from an earlier local-voice job cannot mask it.
        run: |
          uv sync --frozen --python ${{ matrix.python }}
          uv run --frozen --python ${{ matrix.python }} python -c "
          import surtitle.voice.engine as engine
          import surtitle.voice.models as models
          print('core import ok; registered models:', len(models.MODEL_REGISTRY))
          "
      - name: Install the local voice extra
        run: uv sync --frozen --python ${{ matrix.python }} --extra voice-local
      - name: The engines must import and a recogniser config must construct
        run: |
          uv run --frozen --python ${{ matrix.python }} python -c "
          import importlib.metadata as md
          import sherpa_onnx
          import surtitle.voice.local_stt as stt
          import surtitle.voice.local_tts as tts
          import surtitle.voice.models as models
          sherpa_onnx.OnlineRecognizer
          sherpa_onnx.OfflineTts
          # The bindings and the native runtime are one ABI. uv cannot see the
          # dependency between them (its metadata is dynamic), so nothing else
          # would notice the pair drifting apart.
          bindings = md.version('sherpa-onnx')
          runtime = md.version('sherpa-onnx-core')
          assert bindings == runtime, f'sherpa-onnx {bindings} with core {runtime}'
          assert models.model_keys('stt') and models.model_keys('tts')
          print('local voice extra ok:', sherpa_onnx.__file__, bindings)
          "

  package:
    name: Build release archive
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the archive
        run: uv run --frozen python scripts/build_release.py
      - name: Verify the archive layout
        # The build step already verified the archive; this re-applies the same
        # verifier to the exact artifact that will be uploaded, so a packaging
        # regression cannot pass just because the build's own check was skipped.
        # Deliberately a single command: the runner's default shell differs by
        # platform, and this must not depend on which one it is.
        run: uv run --frozen python scripts/build_release.py --verify-only
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: surtitle-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
